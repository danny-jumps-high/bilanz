<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bilanz</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--text:#18212f;--muted:#6f7a89;--line:#e6eaf0;--soft:#f6f8fb;
--green:#17b287;--green-soft:#e3f7f0;--orange:#ff8a3d;--orange-soft:#fff1e6;--blue:#3b82f6;--blue-soft:#e8f0fe;
--purple:#8b5cf6;--purple-soft:#f1ecfe;--red:#e5484d;--red-soft:#fdecec;--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
main{padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.card h2{font-size:13px;margin:0 0 12px;font-weight:600;color:var(--muted);text-transform:none;display:flex;justify-content:space-between;align-items:center}
.card h2 .link{font-weight:500}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;border:0;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabs button.on{color:var(--blue);font-weight:600}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.datenav{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 0}
.datenav button{border:0;background:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.datenav .d{font-weight:600;min-width:150px;text-align:center}
.datenav .today{font-size:12px;color:var(--blue);background:var(--blue-soft);border-radius:20px;padding:4px 10px;width:auto;height:auto;box-shadow:none}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{border-radius:14px;padding:12px 10px;text-align:center}
.tile .n{font-size:22px;font-weight:700;letter-spacing:-.5px}
.tile .l{font-size:11px;color:var(--muted);margin-top:2px}
.tile .s{font-size:11px;color:var(--muted);margin-top:4px}
.tile.g{background:var(--green-soft)}.tile.g .n{color:var(--green)}
.tile.o{background:var(--orange-soft)}.tile.o .n{color:var(--orange)}
.tile.b{background:var(--blue-soft)}.tile.b .n{color:var(--blue)}
.tile.r{background:var(--red-soft)}.tile.r .n{color:var(--red)}
.bar{height:10px;border-radius:10px;background:var(--soft);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;border-radius:10px;background:var(--green);transition:width .3s}
.bar.p i{background:var(--purple)}
.bar.b i{background:var(--blue)}
.between{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.between b{color:var(--text)}
.meal{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--soft);margin-top:8px}
.meal:active{background:var(--green-soft);border-color:var(--green)}
.meal .cat{font-size:11px;color:var(--green);font-weight:600}
.meal .nm{font-weight:600;margin:1px 0}
.meal .ds{font-size:12px;color:var(--muted)}
.meal .kc{font-weight:700;white-space:nowrap;text-align:right}
.meal .kc small{display:block;font-weight:500;font-size:11px;color:var(--purple)}
.meal .done{background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-left:8px;flex:none}
.entry{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.entry:last-child{border-bottom:0}
.entry .t{font-size:11px;color:var(--muted);width:40px;flex:none}
.entry .nm{flex:1;font-size:14px}
.entry .kc{font-weight:600;white-space:nowrap}
.entry .kc small{color:var(--purple);font-weight:500;margin-left:6px}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1;min-width:0}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--soft);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.wide{width:100%;margin-top:8px}
.btn:active{opacity:.75}
.link{background:none;border:0;color:var(--blue);padding:0;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips button{border:0;background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chips button.on{background:var(--blue);color:#fff;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:10px 0;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border:0}
.stat b{font-weight:600}
.streak{display:flex;align-items:center;gap:14px}
.streak .n{font-size:34px;font-weight:700;color:var(--orange)}
.miles{position:relative;height:36px;margin-top:8px}
.miles .track{position:absolute;top:14px;left:0;right:0;height:8px;background:var(--soft);border-radius:8px}
.miles .fill{position:absolute;top:14px;left:0;height:8px;background:var(--blue);border-radius:8px}
.miles .m{position:absolute;top:8px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--line);transform:translateX(-50%);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.miles .m.hit{border-color:var(--blue);background:var(--blue);color:#fff}
.miles .m.goal{border-color:var(--green)}.miles .m.goal.hit{background:var(--green)}
.mlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:11px}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;align-items:flex-end;z-index:10}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:17px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#18212f;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
details summary{cursor:pointer;color:var(--blue);font-size:13px;list-style:none;margin-top:6px}
details summary::-webkit-details-marker{display:none}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--muted);margin-left:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1 id="title">Heute</h1><span class="muted small" id="sub"></span></header>
<main id="view"></main>
<nav class="tabs">
<button id="tab-today" onclick="A.tab('today')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Heute</button>
<button id="tab-weight" onclick="A.tab('weight')"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-8 4 5"/></svg>Gewicht</button>
<button id="tab-stats" onclick="A.tab('stats')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Auswertung</button>
<button id="tab-more" onclick="A.tab('more')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Mehr</button>
</nav>
<div class="modal-bg" id="modalbg" onclick="if(event.target===this)A.closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Daten & Plan ---------- */
const KEY='bilanz-v1';
const DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const PLAN=[
{id:'f1',cat:'Frühstück',name:'Joghurt mit Apfel & Heidelbeeren',desc:'250 g Joghurt · 150 g Apfel · 100 g Heidelbeeren',kcal:260,p:11},
{id:'f2',cat:'Frühstück',name:'Joghurt mit Birne & Heidelbeeren',desc:'250 g Joghurt · 180 g Birne · 100 g Heidelbeeren',kcal:270,p:11},
{id:'m1',cat:'Mittag',name:'Kartoffeln, Gemüse & 3 Eier',desc:'500 g Kartoffeln · 300 g Karotten · 150 g Brokkoli · 3 Eier · 15 g Olivenöl',kcal:725,p:32},
{id:'m2',cat:'Mittag',name:'Reis, Gemüse & 3 Eier',desc:'95 g Reis · 300 g Karotten · 150 g Brokkoli · 3 Eier · 10 g Olivenöl',kcal:710,p:31},
{id:'m3',cat:'Mittag',name:'Kartoffeln, Gemüse & 3 Eier (10 g Öl)',desc:'500 g Kartoffeln · 300 g Karotten · 150 g Brokkoli · 3 Eier · 10 g Olivenöl',kcal:680,p:32},
{id:'m4',cat:'Mittag',name:'Reis, Karotten, Brokkoli & 3 Eier',desc:'95 g Reis · 350 g Karotten · 100 g Brokkoli · 3 Eier · 10 g Olivenöl',kcal:710,p:30},
{id:'m5',cat:'Mittag',name:'Kartoffeln, Karotten & 3 Eier',desc:'500 g Kartoffeln · 350 g Karotten · 3 Eier · 15 g Olivenöl',kcal:700,p:29},
{id:'m6',cat:'Mittag',name:'Reis, Karotten, Zucchini & 3 Eier',desc:'95 g Reis · 300 g Karotten · 150 g Zucchini · 3 Eier · 10 g Olivenöl',kcal:690,p:29},
{id:'d1',cat:'Abend',name:'Reis & körniger Frischkäse',desc:'75 g Reis · 300 g Frischkäse · 200 g Karotten · 150 g Paprika',kcal:685,p:43},
{id:'d2',cat:'Abend',name:'Kartoffeln & körniger Frischkäse',desc:'400 g Kartoffeln · 300 g Frischkäse · 200 g Karotten · 150 g Paprika',kcal:630,p:42},
{id:'d3',cat:'Abend',name:'Reis & körniger Frischkäse (80 g Reis)',desc:'80 g Reis · 300 g Frischkäse · 200 g Karotten · 150 g Paprika',kcal:705,p:44},
{id:'s1',cat:'Snack',name:'Birne & Joghurt',desc:'1 Birne · 200 g Joghurt',kcal:220,p:8},
{id:'s2',cat:'Snack',name:'2 Eier & Apfel',desc:'2 Eier · 1 Apfel',kcal:235,p:13},
{id:'s3',cat:'Snack',name:'2 Eier & Birne',desc:'2 Eier · 1 Birne',kcal:245,p:13}];
const WEEK={1:['f1','m1','d1','s1'],2:['f2','m2','d2','s2'],3:['f1','m3','d1','s3'],4:['f2','m4','d2','s2'],5:['f1','m5','d3','s3'],6:['f2','m6','d2','s2'],0:['f1','m3','d1','s3']};
const planById=id=>PLAN.find(m=>m.id===id);

const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const fmtDE=s=>{const d=parse(s);return DAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]};
const fmtShort=s=>{const d=parse(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'};
const r=n=>Math.round(n);
const kg=n=>n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowTime=()=>{const d=new Date();return z(d.getHours())+':'+z(d.getMinutes())};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};

function defaults(){return{profile:{height:181,age:39,sex:'m',start:107,goal:85,pal:1.35,rate:0.75,fixed:0,protein:100},custom:[],days:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.profile){s.custom=s.custom||[];s.days=s.days||{};return s}}catch(e){}return defaults()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Speichern fehlgeschlagen')}}
const UI={tab:'today',date:today(),period:'day',wrange:90,showAll:false};
const blank=()=>({meals:[],sport:[],weight:null,waist:null,belly:null,note:''});
function day(d){return S.days[d]||(S.days[d]=blank())}
function get(d){return S.days[d]||blank()}

/* ---------- Berechnungen ---------- */
function weightAt(d){const ks=Object.keys(S.days).filter(k=>k<=d&&S.days[k].weight).sort();return ks.length?S.days[ks[ks.length-1]].weight:S.profile.start}
function bmr(w){const p=S.profile;return 10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161)}
function calc(d){
  const g=get(d),p=S.profile,w=weightAt(d);
  const base=bmr(w)*p.pal;
  const sport=g.sport.reduce((a,s)=>a+(+s.kcal||0),0);
  const burn=base+sport;
  const sum=k=>g.meals.reduce((a,m)=>a+(+m[k]||0),0);
  const intake=sum('kcal'),prot=sum('p'),fat=sum('f'),carb=sum('c');
  const target=p.fixed>0?p.fixed:burn-p.rate*1100;
  return{w,base,sport,burn,intake,prot,fat,carb,target,balance:intake-burn,tracked:g.meals.length>0||g.sport.length>0};
}
function streak(){let n=0,d=today();if(!get(d).meals.length)d=addDays(d,-1);while(get(d).meals.length){n++;d=addDays(d,-1)}return n}
function weightSeries(){return Object.keys(S.days).filter(k=>S.days[k].weight).sort().map(k=>({d:k,w:S.days[k].weight}))}
function trendSeries(ws){return ws.map(p=>{const from=addDays(p.d,-6);const win=ws.filter(q=>q.d>=from&&q.d<=p.d);return{d:p.d,w:win.reduce((a,q)=>a+q.w,0)/win.length}})}
function forecast(){
  const p=S.profile,ws=weightSeries(),tr=trendSeries(ws);
  const cur=ws.length?ws[ws.length-1].w:p.start;
  const trendNow=tr.length?tr[tr.length-1].w:cur;
  let slope=null,basis='trend';
  if(tr.length>=5){
    const last=tr.filter(q=>q.d>=addDays(tr[tr.length-1].d,-27));
    if(last.length>=5){
      const x0=parse(last[0].d);const pts=last.map(q=>[(parse(q.d)-x0)/864e5,q.w]);const n=pts.length;
      const mx=pts.reduce((a,q)=>a+q[0],0)/n,my=pts.reduce((a,q)=>a+q[1],0)/n;
      const num=pts.reduce((a,q)=>a+(q[0]-mx)*(q[1]-my),0),den=pts.reduce((a,q)=>a+(q[0]-mx)**2,0);
      if(den>0)slope=num/den;
    }
  }
  let rising=false;
  if(slope===null||slope>=-0.005){if(slope!==null)rising=true;basis='plan';slope=-p.rate/7}
  const days=(trendNow-p.goal)/(-slope);
  return{cur,trendNow,slope,days,date:days>0?addDays(today(),r(days)):null,basis,rising,enough:tr.length>=5};
}
function milestones(){const p=S.profile,out=[];for(let m=Math.floor((p.start-0.01)/5)*5;m>p.goal;m-=5)out.push(m);out.push(p.goal);return out}

/* ---------- Zeiträume ---------- */
function aggregate(a,b,label){
  let n=0,intake=0,burn=0,prot=0,hit=0;const t=today();
  for(let d=a;d<=b&&d<=t;d=addDays(d,1)){const c=calc(d);if(!c.tracked)continue;n++;intake+=c.intake;burn+=c.burn;prot+=c.prot;if(c.intake<=c.target)hit++}
  return{label,a,b,n,intake:n?intake/n:null,burn:n?burn/n:null,prot:n?prot/n:null,hit,bal:intake-burn};
}
function buckets(per){
  const t=today(),d=parse(t),out=[];const n={day:14,week:12,month:12,quarter:8,half:6,year:5}[per];
  for(let i=n-1;i>=0;i--){
    let a,b,label,m;const yy=x=>String(x.getFullYear()).slice(2);
    if(per==='day'){a=b=addDays(t,-i);label=fmtShort(a)}
    else if(per==='week'){const dow=(d.getDay()+6)%7;a=addDays(t,-dow-7*i);b=addDays(a,6);label='KW'+isoWeek(parse(a))}
    else if(per==='month'){m=new Date(d.getFullYear(),d.getMonth()-i,1);a=iso(m);b=iso(new Date(m.getFullYear(),m.getMonth()+1,0));label=MONTHS[m.getMonth()]+' '+yy(m)}
    else if(per==='quarter'){m=new Date(d.getFullYear(),(Math.floor(d.getMonth()/3)-i)*3,1);a=iso(m);b=iso(new Date(m.getFullYear(),m.getMonth()+3,0));label='Q'+(Math.floor(m.getMonth()/3)+1)+' '+yy(m)}
    else if(per==='half'){m=new Date(d.getFullYear(),(Math.floor(d.getMonth()/6)-i)*6,1);a=iso(m);b=iso(new Date(m.getFullYear(),m.getMonth()+6,0));label='H'+(Math.floor(m.getMonth()/6)+1)+' '+yy(m)}
    else{const y=d.getFullYear()-i;a=y+'-01-01';b=y+'-12-31';label=String(y)}
    out.push(aggregate(a,b,label));
  }
  return out;
}

/* ---------- Diagramm (SVG) ---------- */
function chart({type,labels,series,h=210,ymin,ymax,fmt=v=>r(v)}){
  const W=360,padL=40,padR=10,padT=12,padB=26,iw=W-padL-padR,ih=h-padT-padB;
  const all=series.flatMap(s=>s.values).filter(v=>v!=null);
  if(!all.length)return'<div class="empty">Noch keine Daten in diesem Zeitraum</div>';
  let lo=ymin??Math.min(...all),hi=ymax??Math.max(...all);
  if(type==='bar'&&ymin==null)lo=Math.min(0,lo);
  if(hi===lo){hi+=1;lo-=1}
  const pd=(hi-lo)*0.08;if(ymin==null)lo-=pd;if(ymax==null)hi+=pd;
  const n=labels.length,bw=iw/n;
  const x=i=>type==='bar'?padL+i*bw+bw/2:padL+(n>1?i*iw/(n-1):iw/2);
  const y=v=>padT+ih-(v-lo)/(hi-lo)*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,yy=y(v);g+=`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#eceff4"/><text x="${padL-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8a94a3">${fmt(v)}</text>`}
  const step=Math.ceil(n/7);
  labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#8a94a3">${esc(l)}</text>`});
  if(type==='bar'){
    const m=series.length,w=bw*0.72/m;
    series.forEach((s,si)=>s.values.forEach((v,i)=>{if(v==null)return;const xx=padL+i*bw+bw*0.14+si*w,y0=y(Math.max(lo,0)),yv=y(v);g+=`<rect x="${xx}" y="${Math.min(yv,y0)}" width="${w}" height="${Math.max(1,Math.abs(y0-yv))}" rx="3" fill="${s.color}"/>`}));
  }else{
    series.forEach(s=>{let path='',prev=false;s.values.forEach((v,i)=>{if(v==null){prev=false;return}path+=(prev?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';prev=true});
      g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.5}" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="5 4"':''}/>`;
      if(s.dots)s.values.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"/>`})});
  }
  const legend=series.filter(s=>s.name).map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return`<svg viewBox="0 0 ${W} ${h}" width="100%" style="display:block">${g}</svg>${legend?`<div class="legend">${legend}</div>`:''}`;
}

function render(){
  const v=document.getElementById('view');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+UI.tab));
  const titles={today:'Heute',weight:'Gewicht',stats:'Auswertung',more:'Mehr'};
  document.getElementById('title').textContent=titles[UI.tab];

}

function viewWeight(){
  const p=S.profile,ws=weightSeries(),tr=trendSeries(ws),f=forecast(),st=streak();
  const cur=f.cur,lost=p.start-cur,total=p.start-p.goal,pct=Math.max(0,Math.min(100,lost/total*100));
  const ms=milestones();
  const from=UI.wrange?addDays(today(),-UI.wrange):null;
  const sel=from?ws.filter(q=>q.d>=from):ws,selT=from?tr.filter(q=>q.d>=from):tr;
  let labels=[],wv=[],tv=[];
  if(sel.length){const a=sel[0].d,b=today();for(let d=a;d<=b;d=addDays(d,1)){labels.push(fmtShort(d));const w=sel.find(q=>q.d===d),t=selT.find(q=>q.d===d);wv.push(w?w.w:null);tv.push(t?t.w:null)}}
  const lo=Math.min(p.goal,...(wv.filter(v=>v!=null)))-1,hi=Math.max(...(wv.filter(v=>v!=null).length?wv.filter(v=>v!=null):[p.start]))+1;
  const rateWk=-f.slope*7;
  const waist=Object.keys(S.days).filter(k=>S.days[k].waist||S.days[k].belly).sort();
  return`
  <div class="card">
    <div class="streak"><div class="n">${st}</div><div><b>${st===1?'Tag':'Tage'} in Folge</b> getrackt<div class="small muted">${st?'Weiter so, die Serie zählt jeden Tag mit mindestens einer Mahlzeit.':'Trag heute eine Mahlzeit ein, um die Serie zu starten.'}</div></div></div>
  </div>
  <div class="card"><h2>Fortschritt</h2>
    <div class="between"><span>Aktuell <b>${kg(cur)} kg</b></span><span>${lost>=0?`<b>${kg(lost)} kg</b> geschafft`:`<b style="color:var(--red)">+${kg(-lost)} kg</b>`}</span></div>
    <div class="miles"><div class="track"></div><div class="fill" style="width:${pct}%"></div>
      ${ms.map(m=>`<div class="m ${cur<=m?'hit':''} ${m===p.goal?'goal':''}" style="left:${(p.start-m)/total*100}%">${cur<=m?'✓':''}</div>`).join('')}
    </div>
    <div class="mlabels"><span>${kg(p.start)} kg</span><span>Ziel ${kg(p.goal)} kg</span></div>
    <div class="small muted" style="margin-top:8px">Meilensteine: ${ms.map(m=>`<span class="${cur<=m?'':'muted'}" style="${cur<=m?'color:var(--blue);font-weight:600':''}">${m} kg</span>`).join(' · ')}</div>
  </div>
  <div class="card"><h2>Verlauf</h2>
    <div class="chips" style="margin-bottom:8px">${[[28,'4 Wochen'],[90,'3 Monate'],[365,'1 Jahr'],[0,'Alles']].map(([n,l])=>`<button class="${UI.wrange===n?'on':''}" onclick="A.wrange(${n})">${l}</button>`).join('')}</div>
    ${chart({type:'line',labels,ymin:lo,ymax:hi,fmt:v=>v.toFixed(1),series:[
      {name:'Gewicht',color:'#93b4f5',values:wv,dots:true,width:1.5},
      {name:'7-Tage-Trend',color:'#3b82f6',values:tv,width:3},
      {name:'Ziel',color:'#17b287',values:labels.map(()=>p.goal),dash:true,width:1.5}]})}
  </div>
  <div class="card"><h2>Prognose</h2>
    ${f.date?`<div class="stat"><span>Ziel ${kg(p.goal)} kg voraussichtlich</span><b>${fmtDE(f.date)} ${parse(f.date).getFullYear()}</b></div>`:''}
    <div class="stat"><span>Tempo</span><b>${kg(rateWk)} kg / Woche</b></div>
    <div class="stat"><span>Noch bis zum Ziel</span><b>${kg(Math.max(0,f.trendNow-p.goal))} kg</b></div>
    <div class="small muted" style="margin-top:8px">${f.basis==='trend'?'Berechnet aus deinem Gewichtstrend der letzten 4 Wochen.':f.enough&&f.rising?'Dein Trend zeigt gerade nicht nach unten, deshalb rechnet die App mit dem geplanten Tempo aus dem Profil.':'Noch zu wenige Gewichtseinträge für einen Trend, die Prognose nutzt das geplante Tempo aus dem Profil. Wiege dich ein paar Tage, dann wird sie genauer.'}</div>
  </div>
  ${waist.length?`<div class="card"><h2>Umfänge</h2>
    ${chart({type:'line',labels:waist.map(fmtShort),fmt:v=>v.toFixed(0),series:[{name:'Taille',color:'#8b5cf6',values:waist.map(k=>S.days[k].waist||null),dots:true},{name:'Bauch',color:'#ff8a3d',values:waist.map(k=>S.days[k].belly||null),dots:true}]})}
  </div>`:''}`;
}

function viewStats(){
  const per=UI.period,bs=buckets(per),labels=bs.map(b=>b.label);
  const intake=bs.map(b=>b.intake),burn=bs.map(b=>b.burn);
  const wk=aggregate(addDays(today(),-6),today(),'7 Tage');
  const dow=(parse(today()).getDay()+6)%7,mon=addDays(today(),-dow);
  let budget=0,used=0,daysLeft=0;
  for(let i=0;i<7;i++){const d=addDays(mon,i);const c=calc(d);budget+=c.target;if(d<=today())used+=c.intake;else daysLeft++}
  const rest=budget-used;const todayLeft=calc(today()).target-calc(today()).intake;
  const names={day:'Tag',week:'Woche',month:'Monat',quarter:'Quartal',half:'Halbjahr',year:'Jahr'};
  const dataBs=bs.filter(b=>b.n);
  return`
  <div class="chips">${Object.entries(names).map(([k,l])=>`<button class="${per===k?'on':''}" onclick="A.period('${k}')">${l}</button>`).join('')}</div>
  <div class="card"><h2>Aufnahme vs. Verbrauch <span class="muted small">Ø kcal / Tag</span></h2>
    ${chart({type:'line',labels,series:[{name:'Aufgenommen',color:'#17b287',values:intake,dots:true},{name:'Verbraucht',color:'#ff8a3d',values:burn,dots:true}]})}
  </div>
  <div class="card"><h2>Balkenvergleich</h2>
    ${chart({type:'bar',labels,series:[{name:'Aufgenommen',color:'#17b287',values:intake},{name:'Verbraucht',color:'#ff8a3d',values:burn}]})}
  </div>
  <div class="card"><h2>Wochenrückblick <span class="muted small">letzte 7 Tage</span></h2>
    ${wk.n?`
    <div class="stat"><span>Ø aufgenommen</span><b>${r(wk.intake)} kcal</b></div>
    <div class="stat"><span>Ø verbraucht</span><b>${r(wk.burn)} kcal</b></div>
    <div class="stat"><span>Ø Bilanz</span><b style="color:${wk.intake-wk.burn<0?'var(--green)':'var(--red)'}">${r(wk.intake-wk.burn)} kcal</b></div>
    <div class="stat"><span>Ø Protein</span><b>${r(wk.prot)} g</b></div>
    <div class="stat"><span>Tage im Ziel</span><b>${wk.hit} von ${wk.n}</b></div>
    <div class="stat"><span>Rechnerisch abgenommen</span><b>${kg(-wk.bal/7700)} kg</b></div>`:'<div class="empty">Noch keine Einträge in den letzten 7 Tagen</div>'}
  </div>
  <div class="card"><h2>Wochenbudget <span class="muted small">Mo–So</span></h2>
    <div class="between"><span>Verbraucht <b>${r(used)}</b> von ${r(budget)} kcal</span><span>${daysLeft} ${daysLeft===1?'Tag':'Tage'} übrig</span></div>
    <div class="bar b"><i style="width:${Math.min(100,used/budget*100)}%;background:${used>budget?'var(--red)':'var(--blue)'}"></i></div>
    <div class="small muted">${rest>=0?`Noch ${r(rest)} kcal für den Rest der Woche${daysLeft?`, also Ø ${r((rest-Math.max(0,todayLeft))/daysLeft)} kcal pro weiterem Tag nach heute`:''}.`:`Budget um ${r(-rest)} kcal überschritten.`} Ein guter Tag gleicht einen schlechten aus.</div>
  </div>
  <div class="card"><h2>Tabelle</h2>
    ${dataBs.length?`<table><tr><th>${names[per]}</th><th>Ø auf.</th><th>Ø verbr.</th><th>Ø Prot.</th><th>Tage</th></tr>${dataBs.map(b=>`<tr><td>${esc(b.label)}</td><td style="color:var(--green)">${r(b.intake)}</td><td style="color:var(--orange)">${r(b.burn)}</td><td>${r(b.prot)} g</td><td>${b.hit}/${b.n}</td></tr>`).join('')}</table><div class="small muted" style="margin-top:6px">Tage = Tage im Ziel / getrackte Tage</div>`:'<div class="empty">Noch keine Daten</div>'}
  </div>`;
}

/* ---------- Aktionen ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').classList.add('on')}
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
const num=id=>{const v=parseFloat(String(document.getElementById(id).value).replace(',','.'));return isNaN(v)?null:v};

const A={
  tab(t){UI.tab=t;render()},
  shift(n){UI.date=addDays(UI.date,n);render()},
  goToday(){UI.date=today();render()},
  toggleAll(){UI.showAll=!UI.showAll;render()},
  period(p){UI.period=p;render()},
  wrange(n){UI.wrange=n;render()},
  addMeal(m){day(UI.date).meals.push({...m,t:nowTime()});save();render();toast(`${m.name} · ${r(m.kcal)} kcal`)},
  addPlan(id){const m=planById(id);A.addMeal({pid:id,name:m.name,kcal:m.kcal,p:m.p})},
  addCustom(i){const m=S.custom[i];A.addMeal({name:m.name,kcal:m.kcal,p:m.p||0,f:m.f||0,c:m.c||0})},
  delMeal(i){day(UI.date).meals.splice(i,1);save();render()},
  copyYesterday(){
    let d=addDays(UI.date,-1),tries=0;while(!get(d).meals.length&&tries<30){d=addDays(d,-1);tries++}
    if(!get(d).meals.length)return toast('Kein Tag zum Kopieren gefunden');
    get(d).meals.forEach(m=>day(UI.date).meals.push({...m}));save();render();toast(`${get(d).meals.length} Mahlzeiten von ${fmtShort(d)} übernommen`);
  },
  freeEntry(){openModal(`<h3>Frei eintragen</h3>
    <label>Bezeichnung</label><input id="feName" placeholder="z.B. Brötchen mit Käse">
    <div class="grid2"><div><label>kcal</label><input id="feKcal" type="number" inputmode="numeric"></div><div><label>Protein (g)</label><input id="feP" type="number" inputmode="decimal"></div>
    <div><label>Fett (g, optional)</label><input id="feF" type="number" inputmode="decimal"></div><div><label>Kohlenhydrate (g, optional)</label><input id="feC" type="number" inputmode="decimal"></div></div>
    <div class="row"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn primary" onclick="A.saveFree(false)">Eintragen</button></div>
    <button class="btn ghost wide" onclick="A.saveFree(true)">Eintragen und als eigene Mahlzeit merken</button>`);
    setTimeout(()=>document.getElementById('feName').focus(),50)},
  saveFree(remember){const name=document.getElementById('feName').value.trim(),kcal=num('feKcal');if(!name||kcal==null)return toast('Name und kcal fehlen');
    const m={name,kcal,p:num('feP')||0,f:num('feF')||0,c:num('feC')||0};if(remember)S.custom.push({...m});A.closeModal();A.addMeal(m)},
  newCustom(){openModal(`<h3>Eigene Mahlzeit anlegen</h3>
    <label>Name</label><input id="cName" placeholder="z.B. Haferflocken mit Quark"><label>Zutaten (optional)</label><input id="cDesc" placeholder="60 g Haferflocken · 250 g Magerquark">
    <div class="grid2"><div><label>kcal</label><input id="cKcal" type="number" inputmode="numeric"></div><div><label>Protein (g)</label><input id="cP" type="number" inputmode="decimal"></div>
    <div><label>Fett (g, optional)</label><input id="cF" type="number" inputmode="decimal"></div><div><label>Kohlenhydrate (g, optional)</label><input id="cC" type="number" inputmode="decimal"></div></div>
    <div class="row"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn primary" onclick="A.saveCustom()">Anlegen</button></div>`)},
  saveCustom(){const name=document.getElementById('cName').value.trim(),kcal=num('cKcal');if(!name||kcal==null)return toast('Name und kcal fehlen');
    S.custom.push({name,desc:document.getElementById('cDesc').value.trim(),kcal,p:num('cP')||0,f:num('cF')||0,c:num('cC')||0});save();A.closeModal();render();toast('Mahlzeit angelegt')},
  delCustom(i){S.custom.splice(i,1);save();render()},
  estimate(){const min=num('spMin');if(!min)return toast('Dauer eingeben');const met=6;document.getElementById('spKcal').value=r(met*3.5*weightAt(UI.date)/200*min);toast('Schätzung für lockeres Radfahren')},
  addSport(){const name=document.getElementById('spName').value.trim()||'Sport',kcal=num('spKcal'),min=num('spMin');if(kcal==null)return toast('kcal eingeben oder schätzen');
    day(UI.date).sport.push({name,kcal,min});save();render();toast(`${name} · ${r(kcal)} kcal`)},
  delSport(i){day(UI.date).sport.splice(i,1);save();render()},
  saveWeight(){const w=num('wIn');if(w==null||w<30||w>300)return toast('Bitte ein Gewicht in kg eingeben');day(UI.date).weight=w;save();render();toast(`${kg(w)} kg gespeichert`)},
  saveExtras(){const g=day(UI.date);g.waist=num('waist');g.belly=num('belly');g.note=document.getElementById('note').value;save();toast('Gespeichert')},
  saveProfile(){const p=S.profile;p.height=num('pHeight')||p.height;p.age=num('pAge')||p.age;p.sex=document.getElementById('pSex').value;p.pal=parseFloat(document.getElementById('pPal').value);
    p.start=num('pStart')||p.start;p.goal=num('pGoal')||p.goal;p.rate=parseFloat(document.getElementById('pRate').value);p.protein=num('pProt')||p.protein;p.fixed=num('pFixed')||0;save();render();toast('Profil gespeichert')},
  closeModal(){stopCam();document.getElementById('modalbg').classList.remove('on')},
  async scan(){
    openModal(`<h3>Barcode scannen</h3><video id="cam" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:45vh;object-fit:cover"></video>
      <div class="small muted" id="scanmsg" style="margin-top:8px">Kamera wird gestartet …</div>
      <div class="row"><input id="ean" inputmode="numeric" placeholder="oder Nummer unter dem Strichcode"><button class="btn" onclick="A.lookup(document.getElementById('ean').value)">Suchen</button></div>
      <button class="btn wide" onclick="A.closeModal()">Abbrechen</button>`);
    const msg=t=>{const e=document.getElementById('scanmsg');if(e)e.textContent=t};
    if(!('BarcodeDetector' in window)){document.getElementById('cam').style.display='none';msg('Dieser Browser erkennt keine Barcodes per Kamera (Chrome oder Samsung Internet können es). Gib die Nummer ein.');return}
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const video=document.getElementById('cam');video.srcObject=stream;
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});msg('Halte den Strichcode vor die Kamera.');
      const loop=async()=>{if(!stream)return;try{const codes=await det.detect(video);if(codes.length){const code=codes[0].rawValue;stopCam();A.lookup(code);return}}catch(e){}setTimeout(loop,250)};
      video.onloadedmetadata=()=>loop();
    }catch(e){document.getElementById('cam').style.display='none';msg('Kein Kamerazugriff. Gib die Nummer unter dem Strichcode ein.')}
  },
  async lookup(code){
    code=String(code||'').replace(/\D/g,'');if(!code)return toast('Keine Nummer');
    openModal(`<h3>Produkt wird gesucht …</h3><div class="small muted">${code}</div>`);
    try{
      const res=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_de,brands,nutriments`);
      const j=await res.json();if(!j.product)throw new Error('nf');
      const pr=j.product,n=pr.nutriments||{},name=(pr.product_name_de||pr.product_name||'Produkt')+(pr.brands?' ('+pr.brands.split(',')[0]+')':'');
      const per={kcal:n['energy-kcal_100g']??(n.energy_100g?n.energy_100g/4.184:null),p:n.proteins_100g??0,f:n.fat_100g??0,c:n.carbohydrates_100g??0};
      if(per.kcal==null)throw new Error('nd');
      openModal(`<h3>${esc(name)}</h3><div class="small muted">pro 100 g: ${r(per.kcal)} kcal · ${r(per.p)} g Protein · ${r(per.f)} g Fett · ${r(per.c)} g KH</div>
        <label>Menge (g)</label><input id="bcG" type="number" inputmode="numeric" value="100">
        <div class="row"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn primary" onclick="A.addScanned()">Eintragen</button></div>`);
      A._scan={name,per};
    }catch(e){openModal(`<h3>Nicht gefunden</h3><div class="small muted">Für ${code} gibt es keine Daten bei Open Food Facts, oder du bist offline.</div><div class="row"><button class="btn" onclick="A.closeModal()">Schließen</button><button class="btn primary" onclick="A.closeModal();A.freeEntry()">Frei eintragen</button></div>`)}
  },
  addScanned(){const g=num('bcG')||100,s=A._scan,f=g/100;A.closeModal();A.addMeal({name:`${s.name} ${g} g`,kcal:s.per.kcal*f,p:s.per.p*f,f:s.per.f*f,c:s.per.c*f})},
  exportJSON(){download('bilanz-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json')},
  importJSON(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s.profile||!s.days)throw 0;if(!confirm('Backup laden? Die aktuellen Daten werden ersetzt.'))return;S=s;S.custom=S.custom||[];save();render();toast('Backup geladen')}catch(e){toast('Datei nicht lesbar')}};rd.readAsText(f);inp.value=''},
  exportCSV(){const rows=[['Datum','Gewicht','Aufgenommen','Verbraucht','Grundverbrauch','Sport','Ziel','Bilanz','Protein','Taille','Bauch','Notiz']];
    Object.keys(S.days).sort().forEach(d=>{const g=S.days[d],c=calc(d);if(!c.tracked&&!g.weight&&!g.waist&&!g.note)return;rows.push([d,g.weight??'',r(c.intake),r(c.burn),r(c.base),r(c.sport),r(c.target),r(c.balance),r(c.prot),g.waist??'',g.belly??'',(g.note||'').replace(/[\r\n;]/g,' ')])});
    download('bilanz-'+today()+'.csv','\ufeff'+rows.map(x=>x.join(';')).join('\r\n'),'text/csv')},
  reset(){if(confirm('Wirklich alle Einträge und Einstellungen löschen?')){S=defaults();save();render()}}
};
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}
render();
</script>
</body>
</html>
